[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowwhere"
version = "0.1.0"
description = "Python SDK for KnowWhere – pointer-first fractal memory service"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
