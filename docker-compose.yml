services:
  knowwhere:
    build:
      context: .
      args:
        FEATURES: postgres-storage
    ports:
      - "3737:3737"
    environment:
      - RUST_LOG=info
      - KNOWWHERE_API_KEY=${KNOWLEDGE_API_KEY:-kw_admin_default_change_me}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-kw}@kw-postgres:5432/kw
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-snowflake-arctic-embed2}
      - OLLAMA_VLM_MODEL=${OLLAMA_VLM_MODEL:-llama3.2}
      - KNOWWHERE_DATA_DIR=/app/data
    volumes:
      - knowwhere-data:/app/data
    depends_on:
      kw-postgres:
        condition: service_healthy
    restart: unless-stopped

  kw-postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kw}
      POSTGRES_DB: kw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kw"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  knowwhere-data:
  postgres-data:
