services:
  kw-postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kw}
      POSTGRES_DB: kw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kw"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - knowwhere-net
    restart: unless-stopped

  knowwhere:
    build:
      context: .
      args:
        FEATURES: postgres-storage
    ports:
      - "3737:3737"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - KNOWWHERE_API_KEY=${KNOWWHERE_API_KEY:-kw_testkey_12345}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-kw}@kw-postgres:5432/kw
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-snowflake-arctic-embed2}
      - OLLAMA_VLM_MODEL=${OLLAMA_VLM_MODEL:-llama3.2}
      - KNOWWHERE_DATA_DIR=/app/data
      - DREAM_CONSOLIDATION_INTERVAL_MS=${DREAM_CONSOLIDATION_INTERVAL_MS:-3600000}
      - DREAM_CONSOLIDATION_BATCH_SIZE=${DREAM_CONSOLIDATION_BATCH_SIZE:-10}
      # Dataset path for custom datasets (optional, mount a local dir)
      - KNOWWHERE_LONGMEMEVAL_DATASET=/app/benchmarks/hf/fixtures/longmemeval_oracle.json
    volumes:
      - knowwhere-data:/app/data
      # Persist benchmark reports across container restarts (no more docker cp)
      - benchmarks-data:/app/benchmarks/reports
      # Optional: mount local datasets dir to /app/benchmarks/hf/fixtures
      # - ./benchmarks/hf/fixtures:/app/benchmarks/hf/fixtures:ro
    depends_on:
      kw-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3737/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - knowwhere-net
    restart: unless-stopped

volumes:
  knowwhere-data:
  postgres-data:
  benchmarks-data:

networks:
  knowwhere-net:
    driver: bridge
