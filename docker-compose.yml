services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kw-postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kw}
      POSTGRES_DB: kw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kw"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  knowwhere:
    build:
      context: .
      args:
        FEATURES: postgres-storage
    ports:
      - "3737:3737"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - KNOWWHERE_API_KEY=${KNOWWHERE_API_KEY:-kw_default_$(openssl rand -hex 8)}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-kw}@kw-postgres:5432/kw
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-snowflake-arctic-embed2}
      - OLLAMA_VLM_MODEL=${OLLAMA_VLM_MODEL:-llama3.2}
      - KNOWWHERE_DATA_DIR=/app/data
    volumes:
      - knowwhere-data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      kw-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  knowwhere-data:
  postgres-data:
  ollama-data:
