name: Retrieval Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  growing-db:
    name: Growing DB Retrieval Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-retrieval-regression
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run growing DB retrieval regression suite
        run: cargo test --test retrieval_quality growing_db_retrieval_regression_suite -- --ignored
