name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt check
        if: github.event_name == 'pull_request'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          RUSTFLAGS: "--cap-lints=warn"
        run: cargo clippy --all-targets
        # --cap-lints=warn: all #[deny] lints are capped to warnings.
        # This catches new clippy issues while allowing pre-existing warnings.

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUST_LOG: info
        run: cargo test --all-targets

      - name: cargo audit
        run: |
          # Install cargo-binstall (fast binary installer)
          curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-gnu.tgz | tar xz
          # Install cargo-audit via binary (no Rust compilation)
          ./cargo-binstall -y cargo-audit
          cargo audit
        # binstall fetches pre-built binaries — bypasses Rust version constraint

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t knowwhere-server:ci .
