name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Cargo Test (no postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt check
        if: github.event_name == 'pull_request'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          RUSTFLAGS: "--cap-lints=warn"
        run: cargo clippy --all-targets

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test (unit tests only)
        env:
          RUST_LOG: info
        run: cargo test --lib

      - name: cargo audit
        run: |
          curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-gnu.tgz | tar xz
          ./cargo-binstall -y cargo-audit
          cargo audit --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2023-0071

  postgres-test:
    name: Postgres Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-pg
          restore-keys: ${{ runner.os }}-cargo-

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          ollama pull nomic-embed-text-v2-moe

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:11434/api/tags > /dev/null && break
            sleep 2
          done

      - name: Start PostgreSQL with pgvector
        run: |
          docker rm -f kw-pg 2>/dev/null || true
          docker run -d --name kw-pg -e POSTGRES_PASSWORD=kw -e POSTGRES_DB=kw -p 5433:5432 pgvector/pgvector:pg16

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec kw-pg pg_isready -U postgres && break
            sleep 1
          done

      - name: Load PostgreSQL schema
        run: |
          docker exec -i kw-pg psql -U postgres -d kw < docs/postgresql_schema.sql
          for f in $(find migrations -name '*.sql' | sort -V); do
            echo "Loading migration: $f"
            docker exec -i kw-pg psql -U postgres -d kw < "$f" || echo "Warning: migration $f had issues"
          done

      - name: Run integration tests
        env:
          DATABASE_URL: "postgres://postgres:kw@localhost:5433/kw"
          RUST_LOG: info
        run: |
          cargo test --test integration --features postgres-storage -- --include-ignored

      - name: cargo check (postgres-storage)
        run: cargo check --all-targets --features postgres-storage

      - name: cargo clippy (postgres-storage)
        env:
          RUSTFLAGS: "--cap-lints=warn"
        run: cargo clippy --all-targets --features postgres-storage

  feature-matrix:
    name: Feature Matrix Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "openai-provider"
          - "grok-provider"
          - "postgres-storage,openai-provider"
          - "postgres-storage,grok-provider"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.features }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (matrix)
        run: cargo check --all-targets --no-default-features --features "${{ matrix.features }}"

      - name: cargo clippy (matrix)
        env:
          RUSTFLAGS: "--cap-lints=warn"
        run: cargo clippy --all-targets --no-default-features --features "${{ matrix.features }}"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, postgres-test, feature-matrix]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t knowwhere-server:ci .

