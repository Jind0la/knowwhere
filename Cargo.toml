[package]
name = "knowwhere-server"
version = "0.6.0"
edition = "2021"
default-run = "knowwhere-server"
description = "Pointer-first fractal memory service for AI agents"
license = "MIT"
repository = "https://github.com/NimarMoradbakhti/knowwhere"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
axum-governor = "1"
lazy-limit = "1"
real = { version = "0.1", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
google-drive3 = { version = "7", features = ["yup-oauth2-service-account"], optional = true }
yup-oauth2 = { version = "12", optional = true }
hyper = { version = "1", optional = true }
hyper-rustls = { version = "0.27", optional = true }
hyper-util = { version = "0.1", optional = true }
usearch = "2.23"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
blake3 = "1"
subtle = "2.6"
bcrypt = "0.16"
base64 = "0.22"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
bm25 = "2.3.2"
futures = "0.3"

# Lightweight regex-based fact extraction (inline, no LLM required)
regex = "1"

# Cross-encoder reranking (feature-gated)
ort = { version = ">=2.0.0-rc.12, <3", optional = true }
tokenizers = { version = "0.21", optional = true }
ndarray = { version = "0.17", optional = true }

[features]
default = ["reranker"]
# Enable PostgreSQL-backed storage layer (requires DATABASE_URL env var at runtime)
postgres-storage = []

# Cloud embedding provider features (at most one should be enabled at a time)
# When enabled, the corresponding provider is compiled in.
# reqwest is always included (Ollama also needs it).
openai-provider = []
grok-provider = []

# Enable cross-encoder reranking (ONNX Runtime via ort)
# Requires bge-reranker-v2-m3 ONNX model + tokenizer
# Adds ~2.5 GB RAM at runtime
reranker = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

# Enable Google Drive connector
# Adds ~20 transitive dependencies (hyper, yup-oauth2, google-drive3)
google-drive = ["dep:google-drive3", "dep:yup-oauth2", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util"]

# Enable Frigate NVR connector (optional video surveillance integration)
frigate-connector = []

# Enable webhook endpoints (/webhooks/frigate, /webhooks/homeassistant)
webhooks = []

# Vision Language Model worker (cloud/Ollama summarization fallback)
vlm = []

# Cross-modal embedding providers (optional; not part of standard text core)
audio-embedding = []
vision-embedding = []

[[bin]]
name = "longmemeval_canary"
path = "src/bin/longmemeval_canary.rs"

[[bin]]
name = "longmemeval_retrieval_eval"
path = "src/bin/longmemeval_retrieval_eval.rs"

[[bin]]
name = "longmemeval_qa_eval"
path = "src/bin/longmemeval_qa_eval.rs"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
serial_test = "3"
