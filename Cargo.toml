[package]
name = "knowwhere-server"
version = "0.1.0"
edition = "2021"
description = "Pointer-first fractal memory service for AI agents"
license = "MIT"
repository = "https://github.com/NimarMoradbakhti/knowwhere"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
axum-governor = "1"
lazy-limit = "1"
real = { version = "0.1", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
usearch = "2.23"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
blake3 = "1"
subtle = "2.6"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
bm25 = "2.3.2"
futures = "0.3"

[features]
default = []
# Enable PostgreSQL-backed storage layer (requires DATABASE_URL env var at runtime)
postgres-storage = []

# Cloud embedding provider features (at most one should be enabled at a time)
# When enabled, the corresponding provider is compiled in.
# reqwest is always included (Ollama also needs it).
openai-provider = []
grok-provider = []

[dev-dependencies]
http-body-util = "0.1"
