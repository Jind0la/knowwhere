[advisories]
ignore = [
    "RUSTSEC-2025-0057",  # fxhash unmaintained — transitive via bm25, low risk
    "RUSTSEC-2026-0097",  # rand unsound with custom logger — not using custom loggers
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
